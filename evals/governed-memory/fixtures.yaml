      schema: [created, from, for, status, priority, decision, urgency]

  - id: E08
    type: finding
    ref: "F4"
    thesis_changing: true
    subject: "rex: docs | findings F1-F5"
    source_sha: "aaaa118"
    gold:
      propagate: true
      dest: decisions
      priority: high
      path_glob: "_handoff/decisions/*.md"
      schema: [created, from, for, status, priority, decision, urgency]

  - id: E09
    type: finding
    ref: "F1"
    thesis_changing: false
    subject: "rex: docs | guard misses bash -c re-entry"
    source_sha: "aaaa119"
    gold: {propagate: false}

  - id: E10
    type: adr
    ref: "ADR-027"
    status: accepted
    subject: "the signing-key decision is in — recording it upstream"
    source_sha: "aaaa120"
    duplicate_of: E04
    gold: {propagate: false}

  - id: E11
    type: release
    ref: "v1.8.0"
    subject: "shipped the eighth minor — telling the vault"
    source_sha: "aaaa121"
    duplicate_of: E03
    gold: {propagate: false}

  - id: E12
    type: adr
    ref: "ADR-027"
    status: accepted
