# Template — dev archetype (canonical machine truth; AGENT.md is derived from this).
# Fill every {{...}} token at scaffold time. Schema: references/persona.schema.md.
# Capability verbs: references/capability-vocab.v1.md (frozen v1 — never invent verbs).
persona: {{PERSONA_NAME}}
slug: {{PERSONA_SLUG}}
archetype: dev
identity:
  git_name: {{PERSONA_NAME}}
  git_email: {{PERSONA_SLUG}}@{{IDENTITY_DOMAIN}}
  commit_prefix: "{{PERSONA_SLUG}}:"
  routing_label: agent-{{PERSONA_SLUG}}
  # ADR-027 — who this persona is ON THE CODE HOST. git identity above answers
  # "who wrote the commit"; this answers "who opened the PR / posted the verdict /
  # merged it". Without it, every forge action attributes to whoever is ambiently
  # logged in — i.e. the human owner. Provision the account and export the token:
  # docs/runbooks/forge-identity.md. NEVER put a credential in this file.
  forge:
    provider: github
    login: {{FORGE_LOGIN}}        # the machine account / app handle (public, not a secret)
    # token_env: defaults to BARON_FORGE_TOKEN_{{PERSONA_SLUG_UPPER}} — the NAME of the
    # environment variable holding this persona's token. Override only if yours differs.
    required: false
capabilities:
  allow:
    - read_code
    - read_collab
    - write_code
    - write_path: [findings, _handoff]
    - open_pr
    - run_tests
  deny:
    - write_path: [wiki]
    - merge_pr
    - push_main
    - force_push
    - edit_other_personas
scope:
  summary: >-
    {{PERSONA_SCOPE_SUMMARY}}
  focus:
    - {{PERSONA_SCOPE_LINE_1}}
    - {{PERSONA_SCOPE_LINE_2}}
    - {{PERSONA_SCOPE_LINE_3}}
session_ritual:
  - sync_repos
  - read_conventions
  - check_handoffs
  # Before claiming new work: act on review verdicts that are LIVE at your current head.
  # Ordering matters — feedback on work you already have outranks a new ticket (ADR-008).
  - check_review_feedback
  - check_backlog
runtime:
  trigger: interactive
  # adapters:                 # optional per-persona adapter overrides (v1.1)
  #   claude:
  #     tier: 2               # lock this persona to Tier 2 even if the project default is auto/3
