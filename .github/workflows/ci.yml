name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The docs-coverage check diffs against the PR base, which a depth-1
          # checkout does not have. Everything else here is depth-independent.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Both tests are stdlib-only — no dependency install step by design.
      - name: Bi-runtime acceptance (parses the real adapter tables)
        run: python tests/bi_runtime_accept.py
      - name: Repo lint (placeholders, dead links, fixture leaks, version sync)
        run: python tests/lint_repo.py
      # The audit skill's telemetry-mode checks shipped in v1.6.0 but were
      # never wired into CI, so nothing caught drift between baron's emitted
      # wire shape and the ingester that reads it. Stdlib-only, like the two
      # above.
      - name: Audit-skill telemetry mode (ingester + baron wire shape)
        run: python skills/multi-agent-audit/tests/test_ingest_otel.py

      # The dashboard snapshot is a projection of a PRIVATE repo committed into
      # this PUBLIC one. This gate fails the build on a leaked path, a leaked
      # credential, or a metric that claims a number it did not measure.
      - name: Dashboard snapshot guard (leaks, shape, honest metrics)
        run: python dashboard/check_snapshot.py

      # The two published doc pages are a projection of docs/*.md, committed so
      # Pages can serve them without a build step. That makes staleness the
      # failure mode: an edited paragraph that never reached the site publishes
      # last week's copy under this week's URL. --check re-renders and diffs.
      - name: Doc pages match their markdown sources
        run: python dashboard/build_docs.py --check

      # CONTRIBUTING.md's "docs land with code" rule, mechanized to the weakest
      # true statement: a cli/ or skills/ change should touch CHANGELOG.md or
      # docs/. ADVISORY on purpose — it sees that a file changed, not that the
      # change describes what shipped, and it has legitimate false positives
      # (refactors, test fixes). It prints and exits 0; `--strict` makes it
      # block, and switching this line over is the one-line escalation to make
      # once there is evidence the warning is ignored rather than answered.
      - name: Docs coverage (advisory — warns, does not block)
        run: |
          python tests/check_docs_coverage.py --base "origin/${{ github.base_ref || 'main' }}"

  # baron CLI (Phase 2, ADR-003; distribution `barony`) — the one packaged
  # component; tested via uv.
  baron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: baron test suite (schemas drift guard, stranding topology, ledger race)
        run: uv run --project cli pytest cli/tests
      # ADR-029: the prior-art gate, run on this repo's OWN corpus. The rule is
      # dogfooded or it is decoration — an accepted ADR here must carry the sweep
      # it rests on, and this step is what makes that refusal unavoidable in the
      # path that matters (the PR). Exit 1 blocks; pre-2026-08-14 records are exempt.
      - name: Prior-art gate (baron adr check)
        run: uv run --project cli baron adr check docs/adr
