name: pages

# Publishes dashboard/ to GitHub Pages. The site root IS dashboard/, so the
# three dashboard versions serve at /v1/, /v2/ and /v3/, the two document pages
# at /overview/ and /value-map/, and the site index at /.
#
# Nothing is generated here: dashboard/data/fleet.json is a COMMITTED artifact
# produced locally by dashboard/build-data.sh against the PRIVATE coordination
# repo, and the doc pages are committed the same way. CI has no access to the
# coordination repo and must never try to reach it — this workflow only uploads
# what is already in the tree, after checking it is not stale.
#
# ONE-TIME OWNER STEP: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Until that is set, this workflow will fail at deploy.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      # A docs-only edit still changes the published site, and the drift guard
      # below turns "edited the markdown, forgot to rebuild" into a failure
      # here rather than a stale page nobody notices.
      - 'docs/product-overview.md'
      - 'docs/capability-value-map.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the published snapshot is sane and leak-free
        run: python3 dashboard/check_snapshot.py

      - name: Verify the doc pages match their markdown sources
        run: python3 dashboard/build_docs.py --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deployment
        uses: actions/deploy-pages@v4
